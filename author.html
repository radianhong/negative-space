<!DOCTYPE html>

<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      font-family: "Courier New", Courier, monospace;
    }
    .special-text {
      font-family: "Courier New", Courier, monospace;
    }
  </style>
</head>
<body>
  <main class="poem-container">
    <section class="poem-slide">
      <article class="poem-content">
        <h2>Poem One</h2>
        <p>First line of the poem,<br>
        Second line sits right below,<br>
        Centered on the screen.</p>
      </article>
    </section>
        <section class="poem-slide">
      <article class="poem-content">
        <h2>Poem Two</h2>
        <p>Scroll down to reveal,<br>
        Another verse takes the stage,<br>
        One piece at a time.</p>
      </article>
    </section>
    <section class="poem-slide">
      <article class="poem-content">
        <h2>Poem Three</h2>
        <p>Quiet reading space,<br>
        No clutter around the words,<br>
        Just the text itself.</p>
      </article>
    </section>
  </main>
</body>
</html>
